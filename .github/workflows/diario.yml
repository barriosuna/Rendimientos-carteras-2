name: Rendimientos carteras

on:
  schedule:
    - cron: "20 12 * * 1-5"    # 09:20 Argentina (UTC-3), lunes a viernes
  workflow_dispatch:            # boton para correrlo a mano

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write           # necesario para el commit de la landing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -q -r requirements.txt

      - name: Actualizar el Sheet
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SHEET_URL:  ${{ secrets.SHEET_URL }}
        run: python rendimientos.py

      - name: Guardar el grafico como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: grafico-carteras
          path: carteras.png
          if-no-files-found: warn

      # ─── landing "Estrategias de inversion" ───────────────────────────────

      - name: Dependencias de la landing
        run: pip install -q -r landing/requirements.txt

      - name: Generar la landing
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SHEET_URL:  ${{ secrets.SHEET_URL }}
        run: python landing/build.py

      # Si la hoja `control` dice que la ultima rueda esta vieja, build.py sale
      # con codigo 1 y el job se corta aca: no se commitea ni se publica nada.

      - name: Commit si cambio algo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -A toma tambien los archivos nuevos: `git diff` solo ve los ya trackeados,
          # asi que un archivo recien creado pasaba de largo sin avisar.
          git add -A public
          if git diff --cached --quiet; then
            echo "Sin cambios en la landing, no se commitea."
            exit 0
          fi
          echo "Cambios a publicar:"
          git diff --cached --name-only
          git commit -m "landing: rendimientos al $(date -u +%d/%m/%Y) [skip ci]"
          git push
