name: Transcripcion The Compound

on:
  schedule:
    - cron: "0 12 * * 1-5"     # 09:00 Argentina, antes que el resto
  workflow_dispatch:

jobs:
  transcribir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -q yt-dlp youtube-transcript-api gspread google-auth

      - name: Bajar transcripcion y escribir al Sheet
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SHEET_URL:  ${{ secrets.SHEET_URL }}
        run: python transcripcion.py
